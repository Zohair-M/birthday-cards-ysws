<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Cake Catcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>🧁 Present Catcher 🧁</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <!-- Start Screen -->
        <div id="start-screen" class="ui-overlay">
            <h2 style="margin-bottom: 20px;">Catch the Party Items!</h2>
            <button id="start-btn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="ui-overlay hidden">
            <h2 style="color: #ff5252; margin-bottom: 5px;">Game Over!</h2>
            <p id="final-score" style="font-size: 1.2rem; margin-bottom: 20px;">Score: 0</p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <div class="instructions">
        Move the plate using your <strong>Mouse</strong> or <strong>Left/Right Arrow Keys</strong>. <br>
        Catch 🧁, 🎁, and 🕯️. Avoid the 🥦!
    </div>

</body>
</html>
